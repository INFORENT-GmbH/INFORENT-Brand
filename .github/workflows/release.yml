# Ein Tag vX.Y.Z erzeugt ein GitHub-Release mit dem npm-Paket als Anhang.
# Portal und Website hängen an genau dieser Datei (feste Bytes, Prüfsumme im
# package-lock) — nicht am Git-Stand und nicht am automatisch erzeugten
# Quellarchiv, dessen Bytes GitHub nicht garantiert.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  release:
    # Tags setzen nur Org-Mitglieder → die geteilten self-hosted Runner der Orga.
    runs-on: [self-hosted, Linux, shared]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm run check
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - run: npm pack
      - run: gh release create "$GITHUB_REF_NAME" inforent-brand-*.tgz --title "$GITHUB_REF_NAME" --notes-from-tag --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
